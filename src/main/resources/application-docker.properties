spring.application.name=E-CommerceShop

# ============ DATABASE (Docker MySQL) ============
#spring.datasource.url=//${DB_HOST}:${DB_PORT}/${DB_NAME}
# spring.datasource.username=${DB_USER}
#spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============ JWT ============
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ============ EMAIL (Breve) ============
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_SMTP_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:8081}

# ============ SERVER ============
server.port=8085

# ============ GRAPHQL ============
spring.graphql.graphiql.enabled=false
spring.graphql.exception-handling.enabled=true

# ============ ACTUATOR ============
management.endpoints.web.exposure.include=health,info

# ============ BOOTSTRAP ADMIN ============
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.name=Rupali Kishore
app.bootstrap.admin.address=Pune, Maharashtra

# ============ RESET TOKEN ============
app.reset.token.expiry=900000

# ============ LOGGING ============
logging.level.com.order.ecommerceshop.service=INFO
logging.level.org.springframework.mail=WARN

# HikariCP connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=-1







