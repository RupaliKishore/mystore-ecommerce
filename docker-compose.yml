version: '3.8'

services:
  # ============ MySQL Database (Local) ============
  mysql:
    image: mysql:8.0
    container_name: mystore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myshop
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mystore-network

  # ============ Spring Boot Backend ============
  backend:
    build: .
    container_name: mystore-backend
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      # Profile
      SPRING_PROFILES_ACTIVE: local

      # Database (Docker MySQL)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/myshop
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      # JWT
      JWT_SECRET: LocalDevSecretKeyAtLeast64CharactersLongRandomStringHereForTesting!!@2024

      # Email (Brevo)
      BREVO_SMTP_USERNAME: ${BREVO_SMTP_USERNAME:-}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-rupalikishore3011@gmail.com}

      # Frontend URL
      APP_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}

      # Bootstrap admin
      APP_BOOTSTRAP_ADMIN_ENABLED: "true"
      APP_BOOTSTRAP_ADMIN_EMAIL: rupalikishore3011@gmail.com
      APP_BOOTSTRAP_ADMIN_PASSWORD: ChangeMe@1234
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mystore-network

volumes:
  mysql_data:
    driver: local

networks:
  mystore-network:
    driver: bridge